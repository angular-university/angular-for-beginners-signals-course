<toolbar />

<main class="app-main">

  <div class="page-container">

    <tabs
      [tabs]="courseTabs"
      [activeTab]="activeTab()"
      (tabChanged)="onTabChanged($event)"
    />

    @if (coursesService.loading()) {

      <div class="courses-loading">
        <div class="spinner"></div>
        <p>Loading courses...</p>
      </div>

    } @else if (coursesService.error()) {

      <div class="courses-error">
        <span class="material-icons">error_outline</span>
        <p class="error-message">Could not load the courses.</p>
        <p class="error-detail">{{ coursesService.error()?.message }}</p>
        <button class="btn btn-primary" (click)="coursesService.reloadAllCourses()">
          Try again
        </button>
      </div>

    } @else {

      <div class="courses-grid">
        @for (course of courses(); track course.id) {
          <course-card
            class="card"
            [course]="course"
            [index]="$index"
            (editStarted)="onEditStarted($event)"
          />
        } @empty {
          <div class="no-courses">No courses found.</div>
        }
      </div>

    }

  </div>

</main>

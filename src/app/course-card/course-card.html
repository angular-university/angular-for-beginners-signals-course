<article class="course-card" (click)="onCardClick()">
  <div class="card-image-link">
    <img
      class="card-image"
      [src]="course().iconUrl"
      [alt]="course().title"
    />
    @switch (course().category) {
      @case ('BEGINNER') {
        <span class="card-category beginner">Beginners only</span>
      }
      @case ('ADVANCED') {
        <span class="card-category advanced">Expert-level</span>
      }
      @default {
        <span class="card-category">{{ course().category }}</span>
      }
    }
  </div>

  <div class="card-body">
    <div class="card-title-row">
      <h3 class="card-title">
        <span class="card-number">{{ index() + 1 }}.</span> {{ course().title }}
      </h3>

      <button class="btn-icon edit-btn" title="Edit title"
              (click)="onEditClick($event)">
        <span class="material-icons">edit</span>
      </button>
    </div>

    <p class="card-description">
      {{course().description}}
    </p>

    @if (course().price > 0) {
      <div class="card-price">{{ course().price }}</div>
    } @else {
      <div class="card-price">Free</div>
    }
  </div>
</article>

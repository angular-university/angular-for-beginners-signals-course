<div class="page-container">

  <div class="courses-panel-header">
    <div class="section-icon">
      <span class="material-icons">grid_view</span>
    </div>
    <h2 class="courses-panel-title">All Courses</h2>
  </div>

  <tabs [tabs]="courseTabs" [activeTab]="activeTab()" (tabChanged)="onTabChanged($event)" />

  @if (coursesService.loading()) {
    <div class="spinner-container">
      <div class="spinner"></div>
    </div>
  }

  @if (activeTab() === 'beginner') {
    @if (beginnerCourses().length > 0) {
      <courses-card-list (courseEdited)="reloadCourses()" [courses]="beginnerCourses()" />
    } @else {
      <p class="empty-msg">No beginner courses available.</p>
    }
  }

  @if (activeTab() === 'advanced') {
    @if (advancedCourses().length > 0) {
      <courses-card-list (courseEdited)="reloadCourses()" [courses]="advancedCourses()" />
    } @else {
      <p class="empty-msg">No advanced courses available.</p>
    }
  }

</div>

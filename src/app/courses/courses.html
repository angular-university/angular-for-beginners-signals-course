<div class="page-container">

  <div class="courses-panel-header">
    <div class="section-icon">
      <span class="material-icons">grid_view</span>
    </div>
    <h2 class="courses-panel-title">All Courses</h2>

    <button class="btn btn-ghost sort-btn" (click)="toggleSortOrder()">
      <span class="material-icons">swap_vert</span>
      {{ sortAscending() ? 'Oldest first' : 'Newest first' }}
    </button>
  </div>

  @if (coursesService.loading()) {
    <div class="spinner-container">
      <div class="spinner"></div>
    </div>
  } @else if (coursesService.error()) {
    <div class="error-box">
      <span class="material-icons">error_outline</span>
      {{ coursesService.error() }}
    </div>
  } @else {
    <tabs [tabs]="courseTabs" [activeTab]="activeTab()" (tabChanged)="onTabChanged($event)" />

    <div class="courses-count">
      <div class="courses-count-track">
        <div class="courses-count-fill" [style.width.%]="visiblePercent()"></div>
      </div>

      <span class="courses-count-label">
        Showing {{ visibleCount() }} of {{ totalCount() }} courses
      </span>
    </div>

    @if (activeTab() === 'beginner') {
      <courses-card-list (courseEdited)="reloadCourses()" [courses]="beginnerCourses()" />
    } @else if (activeTab() === 'advanced') {
      <courses-card-list (courseEdited)="reloadCourses()" [courses]="advancedCourses()" />
    }
  }

</div>
